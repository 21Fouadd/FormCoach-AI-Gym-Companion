name: ai_gym_trainer
description: AI Gym Trainer mobile app (Live HUD, Face ID, Rep Counter, Form Feedback & Voice Cues).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_tts: ^4.2.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
