name: formcoach
description: AI Gym Trainer & FormCoach mobile app connected to FastAPI AI backend.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
